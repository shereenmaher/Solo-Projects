
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shipment</title>
</head>
<body>

    <h2>Welcome {{ user.firstname }}</h2>

    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'logout' %}">Logout</a>

    <h2>Edit Shipment</h2>

    <form action="{% url 'edit_shipment' shipment.id %}" method="POST">
        {% csrf_token %}

        <label for="name">Shipment Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ shipment.name }}"
        >

        {% if errors.nameerror %}
            <p>{{ errors.nameerror }}</p>
        {% endif %}

        <br>

        <label for="number">Container Number:</label>
        <input
            type="text"
            id="number"
            name="number"
            value="{{ shipment.number }}"
        >

        {% if errors.numbererror %}
            <p>{{ errors.numbererror }}</p>
        {% endif %}

        <br>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
