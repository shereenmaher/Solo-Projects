
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Shipment</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <h2>Welcome {{ user.firstname }}</h2>

    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'logout' %}">Logout</a>

    <h2>Create Shipment</h2>

    <form action="{% url 'create_shipment' %}" method="POST">
        {% csrf_token %}

        <label for="name">Shipment Name:</label>
        <input type="text" id="name" name="name"
               value="{{ request.POST.name|default:'' }}">

        {% if errors.nameerror %}
            <p>{{ errors.nameerror }}</p>
        {% endif %}

        <br>

        <label for="number">Container Number:</label>
        <input type="text" id="number" name="number"
               value="{{ request.POST.number|default:'' }}">

        {% if errors.numbererror %}
            <p>{{ errors.numbererror }}</p>
        {% endif %}

        <br>

        <button type="submit">Create Shipment</button>

    </form>

</body>
</html>
